name: Complete CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  JAVA_VERSION: '21'
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/battleship-game

jobs:
  complete-pipeline:
    name: Complete CI/CD Pipeline
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Verify dependencies
        run: mvn dependency:tree

      - name: Compile project
        run: mvn clean compile

      - name: Run unit tests
        run: mvn test

      - name: SonarQube analysis
        run: |
          mvn -B clean verify
          test -s target/site/jacoco/jacoco.xml
          mvn -B sonar:sonar \
            -Dsonar.projectKey=IGE-123028_Battleship2 \
            -Dsonar.organization=ige-123028 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.sources=src/main/java \
            -Dsonar.tests=src/test/java \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.coverage.jacoco.xmlReportPaths="${GITHUB_WORKSPACE}/target/site/jacoco/jacoco.xml" \
            -Dsonar.exclusions=**/docs/**,**/*.json,**/*.sarif,**/*.yaml,**/*.md
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package application
        run: mvn clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

      - name: Generate Maven site
        run: mvn site

      - name: Prepare GitHub Pages documentation
        run: |
          rm -rf public
          mkdir -p public
          if [ -d "target/site" ]; then cp -r target/site/* public/; fi
          if [ -d "docs" ]; then cp -r docs/* public/; fi
          if [ ! -f "public/index.html" ]; then
            echo "<html><body><h1>Battleship2</h1><p>Documentation generated by GitHub Actions.</p></body></html>" > public/index.html
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4