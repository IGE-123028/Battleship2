# IGE-123016 - Tiago Pires
name: "Qodana - Long Parameter List"

on:
  workflow_dispatch:

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: 'Qodana Scan - Long Parameter List'
        uses: JetBrains/qodana-action@v2026.1
        with:
          args: --profile-path,.qodana/profiles/qodana-123016.yml --fail-threshold 0 --property=project.open.type=Maven
          pr-mode: false
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
