# IGE-123016 - Tiago Pires
name: "Qodana - Complete Code Smells Analysis"

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: 'Qodana'
        uses: JetBrains/qodana-action@v2026.1
        with:
          # Explicitly pointing to your custom profile
          args: --profile-name,qodana.recommended --property=project.open.type=Maven
          # Setting cache to true speeds up subsequent runs
          use-caches: true
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
